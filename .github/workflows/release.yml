name: 🎁 Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ship_run_id:
        description: ID of the GitHub workflow run to ship
        required: true

run-name: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: Publishing
    permissions:
      actions: read # Required to download artifacts
      contents: write # Upload artifacts to Release
      id-token: write # Required for NuGet CLI Login
    steps:
    - name: 🔎 Search for build of ${{ github.ref }}
      shell: pwsh
      id: findrunid
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $restApiRoot = '/repos/${{ github.repository }}'

        if ('${{ inputs.ship_run_id }}') {
          $runid = '${{ inputs.ship_run_id }}'
          $run = gh api "$restApiRoot/actions/runs/$runid" | ConvertFrom-Json
          $workflow = gh api "$restApiRoot/actions/workflows/$($run.workflow_id)" | ConvertFrom-Json
          if ($run.conclusion -ne 'success' `
              -or $run.event -ne 'push' `
              -or $run.head_branch -notmatch '^(?:main|v\d+(?:\.\d+)?)$' `
              -or $workflow.path -ne '.github/workflows/build.yml') {
            throw "Run $runid is not a successful main or release-branch build from build.yml."
          }
          $commitSha = $run.head_sha
        } else {
          # Resolve the release tag to the commit that the selected build must match.
          $resolvedRef = gh api `
            -H "Accept: application/vnd.github+json" `
            -H "X-GitHub-Api-Version: 2022-11-28" `
            $restApiRoot/git/ref/tags/${{ github.ref_name }} `
            | ConvertFrom-Json
          $tagTarget = $resolvedRef.object
          while ($tagTarget.type -eq 'tag') {
            $tagObject = gh api "$restApiRoot/git/tags/$($tagTarget.sha)" | ConvertFrom-Json
            $tagTarget = $tagObject.object
          }
          if ($tagTarget.type -ne 'commit') {
            throw "Release tag points to an unsupported $($tagTarget.type) object."
          }
          $commitSha = $tagTarget.sha
          Write-Host "Resolved ${{ github.ref_name }} to $commitSha"

          $releases = gh run list -R ${{ github.repository }} -c $commitSha -w .github/workflows/build.yml -s success --json databaseId,startedAt,event,headBranch `
            | ConvertFrom-Json | Sort-Object startedAt -Descending

          $eligibleBuilds = @($releases | Where-Object {
            $_.event -eq 'push' -and $_.headBranch -match '^(?:main|v\d+(?:\.\d+)?)$'
          })
          $releaseBranchBuilds = @($eligibleBuilds | Where-Object {
            $_.headBranch -match '^v\d+(?:\.\d+)?$'
          })

          if ($releaseBranchBuilds.Count -gt 0) {
            $selectedBuilds = $releaseBranchBuilds
          } else {
            $selectedBuilds = $eligibleBuilds
          }

          if ($releases.length -eq 0) {
            throw "No successful builds found for ${{ github.ref }}."
          } elseif ($selectedBuilds.Count -eq 0) {
            throw "No successful main or v*.* release-branch build was found for ${{ github.ref }}."
          } else {
            if ($selectedBuilds.Count -gt 1) {
              Write-Warning "More than one eligible build was found for ${{ github.ref }}. Using the most recent."
            }

            $runid = $selectedBuilds[0].databaseId
          }
        }

        Write-Host "Using artifacts from run-id: $runid"

        Echo "runid=$runid" >> $env:GITHUB_OUTPUT
        Echo "commitsha=$commitSha" >> $env:GITHUB_OUTPUT

    - name: 🔻 Download signing request
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: signing-request-Linux
        path: ${{ runner.temp }}/signing
        run-id: ${{ steps.findrunid.outputs.runid }}
        github-token: ${{ github.token }}

    - name: ⚙ Install SignPath PowerShell module
      run: Install-Module -Name SignPath -RequiredVersion 4.4.6 -Scope CurrentUser -Force
      shell: pwsh

    - name: 🔏 Release-sign NuGet packages
      timeout-minutes: 340
      env:
        SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      run: |
        Import-Module SignPath -RequiredVersion 4.4.6
        $SigningRequest = Get-Content '${{ runner.temp }}/signing/signing-request.json' | ConvertFrom-Json
        if ($SigningRequest.commit -ne '${{ steps.findrunid.outputs.commitsha }}') {
          throw "Signing request commit $($SigningRequest.commit) does not match ${{ steps.findrunid.outputs.commitsha }}."
        }

        $SignedArchive = Join-Path $env:RUNNER_TEMP release-signed-deployables.zip
        Submit-SigningRequest `
          -Resubmit `
          -OriginalSigningRequestId $SigningRequest.signingRequestId `
          -SigningPolicySlug release-signing `
          -Description $SigningRequest.version `
          -WaitForCompletion `
          -WaitForCompletionTimeoutInSeconds 19800 `
          -OutputArtifactPath $SignedArchive `
          -OrganizationId $env:SIGNPATH_ORGANIZATION_ID `
          -ApiToken $env:SIGNPATH_API_TOKEN
        Expand-Archive $SignedArchive -DestinationPath '${{ runner.temp }}/deployables'
      shell: pwsh

    - name: 🪪 Authorize NuGet package push
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: 🚀 Push NuGet packages
      run: dotnet nuget push ${{ runner.temp }}/deployables/*.nupkg --source https://api.nuget.org/v3/index.json -k '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'

    - name: 📝 Add code signing policy to release
      shell: pwsh
      if: ${{ github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $restApiRoot = '/repos/${{ github.repository }}'
        $release = gh api "$restApiRoot/releases/tags/${{ github.ref_name }}" | ConvertFrom-Json
        if ($release.body -notmatch '(?im)^## Code signing policy\s*$') {
          $policy = @'
        ## Code signing policy

        Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the project's [code signing policy](https://github.com/AArnott/Nerdbank.MessagePack#code-signing-policy).
        '@
          $body = "$(([string]$release.body).TrimEnd())`n`n$policy"
          @{ body = $body } | ConvertTo-Json | gh api --method PATCH "$restApiRoot/releases/$($release.id)" --input -
        }

    - name: 💽 Upload artifacts to release
      shell: pwsh
      if: ${{ github.event_name == 'release' && github.event.release.assets_url != '' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        Get-ChildItem '${{ runner.temp }}/deployables' -File -Recurse |% {
          Write-Host "Uploading $($_.Name) to release..."
          gh release -R ${{ github.repository }} upload "${{ github.ref_name }}" $_.FullName
        }
